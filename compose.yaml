services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_oracle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d ai_oracle
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_oracle
      SOURCE_REQUEST_TIMEOUT_MS: ${SOURCE_REQUEST_TIMEOUT_MS:-10000}
      SOURCE_REQUEST_LIMIT: ${SOURCE_REQUEST_LIMIT:-20}
    command:
      - sh
      - -c
      - >
        npm run db:deploy &&
        npm run db:seed &&
        npm run start:server
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: .
      target: client
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
    ports:
      - "${CLIENT_PORT:-4173}:4173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
